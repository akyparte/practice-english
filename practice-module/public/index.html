
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English Practice</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <!-- =========================
             USER HEADER
        ========================== -->

        <div class="user-header">

            <div>
                <strong id="userName">Loading...</strong>
                <div id="userEmail"></div>
            </div>

            <button id="logoutBtn" type="button">
                Logout
            </button>

        </div>


        <!-- =========================
             PROGRESS
        ========================== -->

        <div class="progress-section">

            <div class="progress-header">

                <span id="progressText">
                    0 / 0 words completed
                </span>

                <span id="wordNumber">
                    Word 1 of 0
                </span>

            </div>

            <div class="progress-bar">
                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>
            </div>

        </div>


        <!-- =========================
             WORD
        ========================== -->

        <div class="word-section">

            <h1 id="currentWord">
                Loading...
            </h1>

            <p id="currentSentence">
                Loading sentence...
            </p>

        </div>


        <!-- =========================
             TYPING
        ========================== -->

        <div class="typing-section">

            <input
                type="text"
                id="typingInput"
                placeholder="Type the sentence..."
                autocomplete="off"
                spellcheck="false"
            >

            <div id="status"></div>

        </div>


        <!-- =========================
             JUMP
        ========================== -->

        <div class="jump-section">

            <input
                type="number"
                id="jumpNumber"
                placeholder="Word number"
                min="1"
            >

            <input
                type="text"
                id="jumpWord"
                placeholder="Jump to word"
            >

        </div>


        <!-- =========================
             RESET
        ========================== -->

        <button
            id="resetBtn"
            type="button"
        >
            Reset Progress
        </button>

    </div>


    <!-- =========================
         USER / LOGOUT SCRIPT
    ========================== -->

    <script>

        async function loadCurrentUser() {

            try {

                const response = await fetch("/api/auth/me", {
                    credentials: "include"
                });

                if (response.status === 401) {
                    window.location.href = "/login.html";
                    return;
                }

                if (!response.ok) {
                    throw new Error("Failed to load user.");
                }

                const user = await response.json();

                document.getElementById("userName").textContent =
                    user.full_name;

                document.getElementById("userEmail").textContent =
                    user.email;

            } catch (error) {

                console.error(error);

                window.location.href = "/login.html";
            }
        }


        document
            .getElementById("logoutBtn")
            .addEventListener("click", async () => {

                try {

                    await fetch("/api/auth/logout", {
                        method: "POST",
                        credentials: "include"
                    });

                } catch (error) {

                    console.error(error);

                } finally {

                    window.location.href = "/login.html";
                }
            });


        loadCurrentUser();

    </script>

    <script src="/script.js"></script>

</body>
</html>
