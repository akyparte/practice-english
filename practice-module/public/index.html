<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Sentence Practice</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="user-header">
        <div class="user-info">
          <span id="userName"></span>
          <span id="userEmail"></span>
        </div>
        <button id="logoutBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </button>
      </div>
      <h1>English Sentence Practice</h1>
      <p class="tagline">Type each sentence exactly to build muscle memory</p>
      <!-- Progress -->
      <section class="card">
        <div class="progress-header">
          <span id="progressText"> 0 / 0 Practiced </span>
          <span id="wordNumber"> Word #1 </span>
        </div>
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </section>
      <!-- Current Word -->
      <section class="card">
        <p class="label">Word</p>
        <h2 id="currentWord">Loading...</h2>
      </section>
      <!-- Sentence -->
      <section class="card">
        <p class="label">Sentence</p>
        <p id="currentSentence">Loading...</p>
      </section>
      <!-- Typing -->
      <section class="card">
        <p class="label">Type the sentence exactly</p>
        <textarea
          id="typingInput"
          rows="4"
          autocomplete="off"
          spellcheck="false"
          placeholder="Start typing here..."
        ></textarea>
        <p id="status"></p>
      </section>
      <!-- Jump -->
      <section class="card jump-grid">
        <div>
          <label> Jump by Number </label>
          <input id="jumpNumber" type="number" />
          <button id="jumpNumberBtn">Go</button>
        </div>
        <div>
          <label> Jump by Word </label>
          <input id="jumpWord" type="text" />
          <button id="jumpWordBtn">Go</button>
        </div>
      </section>
      <!-- Reset -->
      <button id="resetBtn" class="reset-btn btn-block">Reset Progress</button>
    </div>
    <!-- Authentication -->
    <script>
      async function loadUser() {
        try {
          const response = await fetch("/api/auth/me", {
            credentials: "include",
          });
          if (response.status === 401) {
            window.location.href = "/login.html";
            return;
          }
          if (!response.ok) {
            throw new Error("Failed to load user");
          }
          const user = await response.json();
          document.getElementById("userName").textContent = user.full_name;
          document.getElementById("userEmail").textContent = user.email;
        } catch (error) {
          console.error(error);
          window.location.href = "/login.html";
        }
      }
      async function logout() {
        try {
          await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "include",
          });
        } catch (error) {
          console.error(error);
        } finally {
          window.location.href = "/login.html";
        }
      }
      document.getElementById("logoutBtn").addEventListener("click", logout);
      loadUser();
    </script>
    <script src="script.js"></script>
  </body>
</html>
